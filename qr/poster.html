<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cape Town Quiz — Poster</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    @page { size: A4; margin: 0; }
    :root { --ink:#1F2A44; --ocean:#1E6FB8; --mountain:#2F7D5B; --pink:#E8457A; --sun:#F7C548; --orange:#F08A3C; --lime:#8CC63F; --purple:#8E5BC9; --bg:#FFF8EE; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #ddd; }
    body { font-family: "Inter", system-ui, sans-serif; color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .page {
      width: 210mm; height: 297mm; margin: 10mm auto; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: 14mm 16mm 12mm; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,.15);
    }
    .art { width: 100%; border-radius: 8mm; background: linear-gradient(#BFE3F7, #E9F6FD); display: block; }
    h1 { font-family: "Fredoka", sans-serif; font-size: 58pt; line-height: 1; margin: 9mm 0 3mm; color: var(--ocean); }
    .sub { font-size: 17pt; margin: 0 0 8mm; max-width: 150mm; line-height: 1.35; }
    .qr-box { background: #fff; border-radius: 8mm; padding: 6mm; box-shadow: 0 2mm 6mm rgba(31,42,68,.12); border: 2.5mm solid var(--sun); }
    .qr-box img { width: 78mm; height: 78mm; display: block; }
    .scan { font-family: "Fredoka", sans-serif; font-size: 28pt; margin: 7mm 0 2mm; color: var(--pink); }
    .url { font-size: 12pt; color: #5D6781; margin: 0; }
    .points { display: flex; gap: 5mm; margin-top: auto; font-size: 11.5pt; font-weight: 600; }
    .points span { background: #fff; border-radius: 99px; padding: 2.5mm 5mm; }
    @media print {
      html, body { background: none; }
      .page { margin: 0; box-shadow: none; }
    }
    @media screen and (max-width: 820px) {
      .page { width: 100%; height: auto; min-height: 100vh; margin: 0; padding: 16px; }
      h1 { font-size: 40px; } .sub { font-size: 17px; } .scan { font-size: 24px; }
      .qr-box img { width: 240px; height: 240px; }
      .points { flex-wrap: wrap; justify-content: center; margin-top: 24px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <svg class="art" viewBox="0 0 400 150" aria-hidden="true">
      <circle cx="318" cy="40" r="22" fill="#F7C548"/>
      <path d="M0 110 L38 78 L52 60 L64 54 L74 70 L92 82 L104 46 L282 42 L300 60 L318 34 L338 64 L372 92 L400 102 L400 150 L0 150 Z" fill="#2F7D5B"/>
      <path d="M104 46 L282 42 L284 50 L102 54 Z" fill="#fff" opacity=".85"/>
      <path d="M0 128 Q50 120 100 128 T200 128 T300 128 T400 128 L400 150 L0 150 Z" fill="#1E6FB8"/>
      <rect x="20" y="96" width="34" height="32" fill="#E8457A"/><rect x="54" y="102" width="30" height="26" fill="#F7C548"/>
      <rect x="84" y="94" width="34" height="34" fill="#7BC4E8"/><rect x="118" y="104" width="28" height="24" fill="#8CC63F"/>
      <rect x="146" y="98" width="34" height="30" fill="#F08A3C"/><rect x="180" y="102" width="30" height="26" fill="#8E5BC9"/>
      <g fill="#fff" opacity=".9"><rect x="30" y="106" width="8" height="10"/><rect x="62" y="110" width="8" height="10"/><rect x="94" y="104" width="8" height="10"/><rect x="125" y="112" width="8" height="10"/><rect x="156" y="108" width="8" height="10"/><rect x="188" y="110" width="8" height="10"/></g>
      <g transform="translate(330 94)"><ellipse cx="12" cy="22" rx="12" ry="18" fill="#1F2A44"/><ellipse cx="12" cy="25" rx="7.5" ry="13" fill="#fff"/><circle cx="12" cy="6" r="8" fill="#1F2A44"/><circle cx="15" cy="5" r="1.6" fill="#fff"/><path d="M19 7 L26 9 L19 10 Z" fill="#F08A3C"/></g>
    </svg>

    <h1>Cape Town Quiz</h1>
    <p class="sub">How well do you know the Mother City? Play a quick, fun quiz and discover the stories behind the city.</p>

    <div class="qr-box"><img src="cape-town-quiz-qr.svg" alt="QR code to play the Cape Town Quiz"></div>
    <p class="scan">Scan to play!</p>
    <p class="url">djvanstyrum.github.io/cape-town-quiz</p>

    <div class="points">
      <span>🆓 Free</span><span>📱 No app needed</span><span>⏱ 3 minutes</span><span>🐧 120 questions</span>
    </div>
  </div>
</body>
</html>
